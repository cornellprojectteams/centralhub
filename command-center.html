<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Command Center | Project Teams</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2; --surface:#fff; --surface-2:#fbfaf8;
  --line:#e9e7e1; --line-2:#ded9d0;
  --ink-1:#1c1a17; --ink-2:#57534e; --ink-3:#8f8a80; --ink-4:#b4afa4;
  --accent:#b31b1b; --gold:#e0a020;
  --crit:#c0392b; --crit-bg:#fdeceb; --crit-line:#f5d3cf;
  --warn:#a8720f; --warn-bg:#fbf3e1; --warn-line:#eeddb4;
  --good:#157a47; --good-bg:#e9f6ef; --good-line:#cde8da;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --eyebrow:'Plus Jakarta Sans',var(--font);
  --r:12px; --r-lg:16px;
  --sh:0 1px 2px rgba(28,26,23,.05), 0 1px 3px rgba(28,26,23,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--ink-1);background:var(--bg);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
.eyebrow{font-family:var(--eyebrow);font-weight:800;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}

.masthead{position:sticky;top:0;z-index:20;height:60px;background:linear-gradient(120deg,#8f1515,#6e1010 60%,#560d0d);display:flex;align-items:center}
.masthead::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.mast-inner{max-width:1120px;margin:0 auto;width:100%;padding:0 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;white-space:nowrap}
.seal{width:34px;height:34px;border-radius:50%;background:#fff;color:#8f1515;display:flex;align-items:center;justify-content:center;font-family:var(--eyebrow);font-weight:800;font-size:15px;box-shadow:0 0 0 1.5px rgba(240,192,80,.6)}
.brand b{font-family:var(--eyebrow);font-weight:800;font-size:15px;letter-spacing:-.01em}
.mast-nav{margin-left:auto;display:flex;gap:2px;background:rgba(0,0,0,.2);padding:3px;border-radius:9px}
.mast-nav a{font-family:var(--eyebrow);font-weight:700;font-size:12.5px;color:rgba(255,255,255,.72);text-decoration:none;padding:6px 13px;border-radius:6px}
.mast-nav a.on{background:#fff;color:#8f1515}
.cmdk{margin-left:4px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:rgba(255,255,255,.6);background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);padding:6px 10px;border-radius:8px}
.cmdk kbd{font-family:var(--font);font-size:10.5px;background:rgba(255,255,255,.16);color:#fff;padding:1px 5px;border-radius:4px}
@media(max-width:860px){.cmdk{display:none}}

.wrap{max-width:1120px;margin:0 auto;padding:30px 24px 64px}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-bottom:22px;margin-bottom:26px;border-bottom:1px solid var(--line)}
.hero-l .eyebrow{margin-bottom:10px}
.hero-num{font-size:52px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ink-1);display:flex;align-items:baseline;gap:12px}
.hero-num .n{color:var(--accent)}
.hero-num .t{font-size:19px;font-weight:600;color:var(--ink-2);letter-spacing:-.01em}
.hero-meta{margin-top:12px;font-size:13.5px;color:var(--ink-3)}
.hero-meta b{color:var(--ink-2);font-weight:600}
.hero-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.src-chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--eyebrow);font-weight:700;font-size:11px;letter-spacing:.03em;padding:6px 11px;border-radius:999px}
.src-live{color:var(--good);background:var(--good-bg);border:1px solid var(--good-line)}
.src-sample{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.src-chip .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.hero-r .btns{display:flex;gap:8px}
.ghost-btn{font-family:var(--eyebrow);font-weight:700;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);padding:9px 14px;border-radius:9px;cursor:pointer}
.ghost-btn:hover{border-color:var(--ink-4)}

.sec-head{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.sec-head .eyebrow{color:var(--ink-2)}
.sec-count{font-size:11px;font-weight:700;color:var(--ink-4);font-variant-numeric:tabular-nums}
.sec-rule{flex:1;height:1px;background:var(--line)}

.feed{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}
.attn{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;transition:background .12s;cursor:pointer}
.attn:last-child{border-bottom:none}
.attn:hover{background:var(--surface-2)}
.sev{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.sev-crit{background:var(--crit);box-shadow:0 0 0 4px var(--crit-bg)}
.sev-warn{background:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.attn-body{flex:1;min-width:0}
.attn-title{font-size:14.5px;font-weight:600;color:var(--ink-1);letter-spacing:-.005em}
.attn-sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.attn-dom{display:inline-flex;align-items:center;gap:5px;font-family:var(--eyebrow);font-weight:800;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.attn-dom .dot{width:6px;height:6px;border-radius:50%}
.attn-cta{flex:0 0 auto;display:flex;align-items:center;gap:9px}
.pill{font-family:var(--eyebrow);font-weight:800;font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill-crit{color:var(--crit);background:var(--crit-bg);border:1px solid var(--crit-line)}
.pill-warn{color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-line)}
.arrow{color:var(--ink-4)}
.attn:hover .arrow{color:var(--ink-2)}
.feed-empty{padding:20px 18px;font-size:13.5px;color:var(--ink-3)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:34px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 17px 15px;text-decoration:none;color:inherit;transition:border-color .14s,transform .14s;cursor:pointer}
.stat:hover{border-color:var(--line-2);transform:translateY(-1px)}
.stat-top{display:flex;align-items:center;gap:7px;margin-bottom:14px}
.stat-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.stat-name{font-family:var(--eyebrow);font-weight:800;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.stat-state{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-family:var(--eyebrow);font-weight:800;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase}
.stat-state .d{width:6px;height:6px;border-radius:50%}
.s-action{color:var(--crit)} .s-action .d{background:var(--crit)}
.s-watch{color:var(--warn)} .s-watch .d{background:var(--warn)}
.s-good{color:var(--good)} .s-good .d{background:var(--good)}
.stat-val{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1;color:var(--ink-1)}
.stat-val .u{font-size:14px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:4px}
.stat-sub{font-size:12.5px;color:var(--ink-3);margin-top:9px}
.stat-sub b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}

.panels{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:34px}
@media(max-width:720px){.panels{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px}
.panel-h{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.panel-h .eyebrow{color:var(--ink-2)}
.panel-h .sub{font-size:11.5px;color:var(--ink-4)}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:112px 1fr 26px;align-items:center;gap:12px}
.bar-name{font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:8px;background:#f0efe9;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:0 999px 999px 0}
.bar-val{font-size:12.5px;font-weight:600;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.trend-val{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.trend-val .n{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink-1)}
.trend-val .l{font-size:12px;color:var(--ink-3)}
.spark{width:100%;height:70px;display:block}
.spark-x{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.foot{margin-top:22px;font-size:11.5px;color:var(--ink-4);text-align:center}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-inner">
    <a class="brand" href="index.html"><span class="seal">C</span><b>Project Teams Ops Hub</b></a>
    <nav class="mast-nav">
      <a class="on" href="command-center.html">Command</a>
      <a href="index.html#staff">Staff</a>
      <a href="index.html#admin">Admin</a>
    </nav>
    <span class="cmdk">Search tools <kbd>⌘K</kbd></span>
  </div>
</header>

<div class="wrap">
  <div class="hero">
    <div class="hero-l">
      <div class="eyebrow" id="hero-eyebrow">Operations</div>
      <div class="hero-num"><span class="n" id="hero-num">—</span><span class="t" id="hero-title">loading…</span></div>
      <div class="hero-meta" id="hero-meta"></div>
    </div>
    <div class="hero-r">
      <span class="src-chip src-sample" id="src-chip"><span class="d"></span>Sample data</span>
      <div class="btns"><button class="ghost-btn" id="refresh">Refresh</button></div>
    </div>
  </div>

  <div class="sec-head"><span class="eyebrow">Needs attention</span><span class="sec-count" id="attn-count">0</span><span class="sec-rule"></span></div>
  <div class="feed" id="feed"></div>

  <div class="grid" id="grid"></div>

  <div class="panels">
    <div class="panel">
      <div class="panel-h"><span class="eyebrow">Open space issues by team</span><span class="sub">top 5</span></div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="panel">
      <div class="panel-h"><span class="eyebrow">New space issues</span><span class="sub">last 14 days</span></div>
      <div class="trend-val"><span class="n" id="trend-today">0</span><span class="l" id="trend-sum">today</span></div>
      <svg class="spark" id="spark" viewBox="0 0 280 76" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="spark-x" id="spark-x"></div>
    </div>
  </div>

  <p class="foot" id="foot">Concept · illustrative numbers · every value maps to an existing sheet</p>
</div>

<script>
(function () {
  'use strict';

  // Paste the deployed Ops Command Center API /exec URL here to go live.
  // Empty = render the built-in sample data.
  var STATS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzSfUQgCfkOpXAmEExVh1bHIbIQ7LAipTzP_uW2x2XKKTmZuGvmxpPI6gS1cw7oLVOz/exec';

  // ---- built-in sample payload (same shape the API returns) ----
  var SAMPLE = {
    generatedAt: null,
    hero: { attention: 6, urgent: 3, soon: 3 },
    attention: [
      { sev:'crit', domain:'Space', dot:'#c0392b', title:'5 space issues are overdue', sub:'Oldest: Baja chemical storage · 4 days past deadline', pill:'Overdue', pillType:'crit' },
      { sev:'crit', domain:'Fleet', dot:'#7c3aed', title:'Tacoma is double-booked today', sub:'Rocketry & Baja both hold 2:00–5:00 PM', pill:'Conflict', pillType:'crit' },
      { sev:'crit', domain:'Compliance', dot:'#1f9d5b', title:'2 access waivers have lapsed', sub:'High Voltage Lab · re-sign required before entry', pill:'Lapsed', pillType:'crit' },
      { sev:'warn', domain:'Fabman', dot:'#2563c9', title:'18 Fabman members awaiting training', sub:'Sign-ups from the last 7 days, not yet provisioned', pill:'Pending', pillType:'warn' },
      { sev:'warn', domain:'ELL', dot:'#c07a12', title:'Blocked exits flagged in the ELL', sub:'Reported on the 8–10 PM shift · unverified', pill:'Safety', pillType:'warn' },
      { sev:'warn', domain:'Compliance', dot:'#1f9d5b', title:'8 compliance items expire within 30 days', sub:'Workday EHS renewals across 5 teams', pill:'Soon', pillType:'warn' }
    ],
    domains: [
      { key:'space', name:'Space issues', dot:'#c0392b', live:false, value:14, unit:'open', state:'action', sub:'5 overdue · 3 red · 89 resolved this term' },
      { key:'ell', name:'Learning Lab', dot:'#c07a12', live:false, value:'High', unit:'last shift', state:'watch', sub:'1 safety flag · peak 8–10 PM · 119 logged' },
      { key:'fabman', name:'Fabman', dot:'#2563c9', live:false, value:325, unit:'members', state:'watch', sub:'18 awaiting training · 7 new this week' },
      { key:'compliance', name:'Compliance', dot:'#1f9d5b', live:false, value:8, unit:'expiring', state:'action', sub:'2 lapsed · 79 Workday complete' },
      { key:'fleet', name:'Fleet · Tacoma', dot:'#7c3aed', live:false, value:2, unit:'booked today', state:'action', sub:'1 conflict · 4 pending approval' },
      { key:'inventory', name:'Inventory', dot:'#0d9488', live:false, value:5, unit:'open orders', state:'good', sub:'2 locks out · 44 mill-room items' }
    ],
    charts: {
      teams: [ {name:'Baja',value:7},{name:'Formula',value:5},{name:'Operations',value:4},{name:'Hyperloop',value:3},{name:'Rocketry',value:2} ],
      trend: [2,1,3,0,2,4,1,3,2,5,1,2,3,2]
    }
  };

  var $ = function (id) { return document.getElementById(id); };
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var STATE_CLASS = { action:'s-action', watch:'s-watch', good:'s-good' };
  var STATE_WORD = { action:'Action', watch:'Watch', good:'Good' };

  function render(data, live) {
    // hero
    var h = data.hero || {};
    $('hero-eyebrow').textContent = 'Operations · ' + dateLabel(data.generatedAt);
    $('hero-num').textContent = h.attention != null ? h.attention : 0;
    $('hero-title').textContent = (h.attention === 1 ? 'thing needs' : 'things need') + ' your attention';
    $('hero-meta').innerHTML = '<b>' + (h.urgent||0) + '</b> urgent · <b>' + (h.soon||0) + '</b> soon · everything else is on track';

    // source chip
    var chip = $('src-chip');
    if (live) {
      chip.className = 'src-chip src-live';
      chip.innerHTML = '<span class="d"></span>Live · updated ' + timeLabel(data.generatedAt);
    } else {
      chip.className = 'src-chip src-sample';
      chip.innerHTML = '<span class="d"></span>Sample data';
    }

    // attention feed — sort defensively so urgent always leads, regardless of API order
    var feed = $('feed'); feed.innerHTML = '';
    var sevRank = function (s){ return s === 'crit' ? 0 : (s === 'warn' ? 1 : 9); };
    var items = (data.attention || []).slice().sort(function (a, b){ return sevRank(a.sev) - sevRank(b.sev); });
    $('attn-count').textContent = items.length;
    if (!items.length) {
      feed.innerHTML = '<div class="feed-empty">Nothing needs attention right now. 🎉</div>';
    } else {
      items.forEach(function (a) {
        var el = document.createElement('a');
        el.className = 'attn';
        el.innerHTML =
          '<span class="sev sev-' + (a.sev==='crit'?'crit':'warn') + '"></span>' +
          '<div class="attn-body"><div class="attn-title">' + esc(a.title) + '</div>' +
          '<div class="attn-sub">' + esc(a.sub) + '</div></div>' +
          '<div class="attn-cta"><span class="attn-dom"><span class="dot" style="background:' + esc(a.dot) + '"></span>' + esc(a.domain) + '</span>' +
          '<span class="pill pill-' + (a.pillType==='crit'?'crit':'warn') + '">' + esc(a.pill) + '</span>' +
          '<span class="arrow">→</span></div>';
        feed.appendChild(el);
      });
    }

    // status grid
    var grid = $('grid'); grid.innerHTML = '';
    (data.domains || []).forEach(function (d) {
      var el = document.createElement('a');
      el.className = 'stat';
      el.innerHTML =
        '<div class="stat-top"><span class="stat-dot" style="background:' + esc(d.dot) + '"></span>' +
        '<span class="stat-name">' + esc(d.name) + '</span>' +
        '<span class="stat-state ' + (STATE_CLASS[d.state]||'s-good') + '"><span class="d"></span>' + (STATE_WORD[d.state]||'Good') + '</span></div>' +
        '<div class="stat-val">' + esc(d.value) + '<span class="u">' + esc(d.unit) + '</span></div>' +
        '<div class="stat-sub">' + subBold(d.sub) + '</div>';
      grid.appendChild(el);
    });

    // charts
    renderBars((data.charts||{}).teams || []);
    renderTrend((data.charts||{}).trend || []);

    $('foot').textContent = live
      ? 'Live from Google Sheets · generated ' + timeLabel(data.generatedAt)
      : 'Sample data — connect the stats API to go live';
  }

  function subBold(s){ return esc(s).replace(/(\d[\d,]*)/g, '<b>$1</b>'); }

  function renderBars(teams){
    var el = $('bars'); el.innerHTML = '';
    var max = teams.reduce(function (m,t){ return Math.max(m, t.value); }, 0) || 1;
    teams.forEach(function (t){
      var pct = Math.round(t.value / max * 100);
      var row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML = '<span class="bar-name">' + esc(t.name) + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<span class="bar-val">' + esc(t.value) + '</span>';
      el.appendChild(row);
    });
  }

  function renderTrend(trend){
    var n = trend.length;
    var svg = $('spark');
    if (!n) { svg.innerHTML = ''; return; }
    var W = 260, x0 = 0, top = 16, base = 68;
    var max = trend.reduce(function (m,v){ return Math.max(m,v); }, 0) || 1;
    var step = n > 1 ? W / (n - 1) : 0;
    var pts = trend.map(function (v,i){
      var x = x0 + i*step;
      var y = base - (v / max) * (base - top);
      return [Math.round(x*10)/10, Math.round(y*10)/10];
    });
    var line = pts.map(function (p){ return p[0] + ',' + p[1]; }).join(' ');
    var area = 'M' + pts.map(function (p){ return p[0]+','+p[1]; }).join(' L') + ' L' + pts[n-1][0] + ',' + base + ' L' + pts[0][0] + ',' + base + ' Z';
    var last = pts[n-1];
    svg.innerHTML =
      '<path d="' + area + '" fill="#b31b1b" fill-opacity="0.06"/>' +
      '<polyline points="' + line + '" fill="none" stroke="#c9c4ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="#b31b1b" stroke="#fff" stroke-width="2"/>';
    $('trend-today').textContent = trend[n-1];
    var sum = trend.reduce(function (a,b){ return a+b; }, 0);
    $('trend-sum').textContent = 'today · ' + sum + ' this fortnight';
    $('spark-x').innerHTML = '<span>' + agoLabel(n-1) + '</span><span>' + agoLabel(Math.floor((n-1)/2)) + '</span><span>today</span>';
  }

  // ---- date helpers ----
  function dateLabel(iso){ var d = iso ? new Date(iso) : new Date(); return d.toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}); }
  function timeLabel(iso){ var d = iso ? new Date(iso) : new Date(); return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
  function agoLabel(daysAgo){ var d = new Date(); d.setDate(d.getDate()-daysAgo); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); }

  // ---- JSONP loader (sidesteps CORS to script.google.com) ----
  function loadLive(url){
    return new Promise(function (resolve, reject){
      var cb = '__cc' + Math.random().toString(36).slice(2);
      var s = document.createElement('script');
      var timer = setTimeout(function (){ cleanup(); reject(new Error('timeout')); }, 12000);
      window[cb] = function (data){ cleanup(); resolve(data); };
      function cleanup(){ clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
      s.onerror = function (){ cleanup(); reject(new Error('load')); };
      s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
      document.body.appendChild(s);
    });
  }

  function boot(){
    render(SAMPLE, false);
    if (STATS_ENDPOINT) {
      loadLive(STATS_ENDPOINT).then(function (data){ render(data, true); })
        .catch(function (){ /* keep sample data on failure */ });
    }
  }

  $('refresh').addEventListener('click', function (){
    if (!STATS_ENDPOINT) { render(SAMPLE, false); return; }
    loadLive(STATS_ENDPOINT + (STATS_ENDPOINT.indexOf('?')>=0?'&':'?') + 'fresh=1').then(function (data){ render(data, true); }).catch(function (){});
  });

  boot();
})();
